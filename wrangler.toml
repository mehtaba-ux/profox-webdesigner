name = "profox-web-production"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = "worker/index.ts"

# Automatically compile Vite build into ./dist before deploy
[build]
command = "npm run build"

# Cloudflare Dynamic Worker + Static Assets (100% Free Plan Tier)
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

[vars]
ENVIRONMENT = "production"

