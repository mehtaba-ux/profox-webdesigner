name = "profox-web-production"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = "worker/hardened.ts"

# Keep the production hostname bound to this Worker in repository-controlled
# configuration. The route was previously dashboard-only and could be lost by
# a Git-connected deployment, causing /api/* requests to fall through to HTML.
[[routes]]
pattern = "www.profoxwebdesigner.com/*"
zone_name = "profoxwebdesigner.com"

# Automatically compile Vite build into ./dist before deploy
[build]
command = "npm run build"

# Cloudflare Dynamic Worker + Static Assets (100% Free Plan Tier)
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
# Route frontend assets through the Worker so its security-header middleware
# applies consistently to HTML, SPA routes, static files.
run_worker_first = true

[vars]
ENVIRONMENT = "production"
SUPABASE_URL = "https://calabtayklhltyiriiwo.supabase.co"

# The deployment supplies this through --secrets-file from the protected GitHub
# environment. Declaring it here makes Wrangler warn locally and reject a
# production deploy that would leave authenticated R2 uploads unusable.
[secrets]
required = ["SUPABASE_PUBLISHABLE_KEY"]

# Configure SUPABASE_PUBLISHABLE_KEY as an encrypted Worker secret before deploy.
# If the media API is hosted on a different origin from the application, also add
# an ALLOWED_ORIGINS Worker variable containing a comma-separated origin list.

# Cloudflare R2 Storage Bucket Binding
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "profox-media"
