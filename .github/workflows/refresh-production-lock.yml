name: One-time production lock security refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-production-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Pin patched qs and regenerate deterministic lock
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.overrides = { ...(pkg.overrides || {}), qs: '6.16.0' };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify production dependency audit
        run: npm audit --omit=dev
      - name: Commit deterministic lock refresh and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/refresh-production-lock.yml
          git add package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh production dependency security lock"
          git push origin HEAD:main
