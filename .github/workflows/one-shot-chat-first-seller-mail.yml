name: One-shot chat-first seller mail hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-chat-first-seller-mail.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Harden seller chat-only policy in source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          sales = 'src/components/admin/SalesChatInbox.tsx'
          replace_once(sales,
              "const SALES_ROLES = new Set(['admin','sales','sales_rep','sales_team']);\nconst SALES_CHAT_SOUND_KEY = 'profox_sales_chat_sound_v1';",
              "const SALES_ROLES = new Set(['admin','sales','sales_rep','sales_team']);\nconst PROFESSIONAL_EMAIL_ROLES = new Set(['admin','project_manager','site_manager']);\nconst SALES_CHAT_SOUND_KEY = 'profox_sales_chat_sound_v1';")
          replace_once(sales,
              "  const showSalesTeam = SALES_ROLES.has(String(role || ''));\n",
              "  const showSalesTeam = SALES_ROLES.has(String(role || ''));\n  const canUseProfessionalEmail = PROFESSIONAL_EMAIL_ROLES.has(String(role || ''));\n")
          replace_once(sales,
              "  useEffect(() => { setPendingFiles([]); }, [selectedConv?.id, replyMode]);\n",
              "  useEffect(() => { setPendingFiles([]); }, [selectedConv?.id, replyMode]);\n  useEffect(() => {\n    if (!canUseProfessionalEmail && replyMode === 'email') {\n      setReplyMode(selectedConv?.chatConversationId ? 'chat' : 'note');\n    }\n  }, [canUseProfessionalEmail, replyMode, selectedConv?.chatConversationId]);\n")
          replace_once(sales,
              "  const refreshProfessionalMailState = async () => {\n    try {",
              "  const refreshProfessionalMailState = async () => {\n    if (!canUseProfessionalEmail) {\n      setProfessionalEmailConnected(false);\n      return null;\n    }\n    try {")
          replace_once(sales,
              "  const syncProfessionalInbox = async (silent = true) => {\n    if (!isAuthorizedRole || emailSyncing) return false;",
              "  const syncProfessionalInbox = async (silent = true) => {\n    if (!isAuthorizedRole || !canUseProfessionalEmail || emailSyncing) return false;")
          replace_once(sales,
              "      setInboxError('WhatsApp media is not enabled in the current provider connection. Send the file through Website Chat or Professional Email.');",
              "      setInboxError(`WhatsApp media is not enabled in the current provider connection. Send the file through ${canUseProfessionalEmail ? 'Website Chat or Professional Email' : 'Website Chat'}.`);")
          replace_once(sales,
              "      } else if (replyMode === 'email') {\n        if (!capabilities?.canSendEmail || !selectedConv.crmLeadId) throw new Error('Professional Email is not authorized for this customer and account.');",
              "      } else if (replyMode === 'email') {\n        if (!canUseProfessionalEmail || !capabilities?.canSendEmail || !selectedConv.crmLeadId) throw new Error('Professional Email is available only to authorized Management/Admin accounts.');")
          replace_once(sales,
              "        if (!selectedConv.chatConversationId) throw new Error('This customer does not have a website-chat channel. Choose Email or WhatsApp instead.');",
              "        if (!selectedConv.chatConversationId) throw new Error(canUseProfessionalEmail ? 'This customer does not have a website-chat channel. Use Professional Email or WhatsApp if appropriate.' : 'This customer does not have a website-chat channel. Use WhatsApp if available or start the secure Website Chat relationship.');")
          replace_once(sales,
              "  const canEmail = Boolean(capabilities?.canSendEmail && selectedConv?.crmLeadId && professionalEmailConnected);",
              "  const canEmail = Boolean(canUseProfessionalEmail && capabilities?.canSendEmail && selectedConv?.crmLeadId && professionalEmailConnected);")
          replace_once(sales,
              "<p className=\"text-xs text-slate-500\">One customer timeline for Website Chat, Professional Email, WhatsApp and private team notes.</p>",
              "<p className=\"text-xs text-slate-500\">{canUseProfessionalEmail ? 'One customer timeline for Website Chat, Professional Email, WhatsApp and private team notes.' : 'One customer timeline for Website Chat, WhatsApp and private team notes.'}</p>")
          replace_once(sales,
              "{conversation.hasEmail && <span className=\"rounded border border-sky-200 bg-sky-50 px-1.5 py-0.5 text-[9px] font-bold text-sky-700\">Email</span>}",
              "{canUseProfessionalEmail && conversation.hasEmail && <span className=\"rounded border border-sky-200 bg-sky-50 px-1.5 py-0.5 text-[9px] font-bold text-sky-700\">Email</span>}")
          replace_once(sales,
              "<button type=\"button\" disabled={!canEmail} onClick={() => setReplyMode('email')} className={`rounded-lg border px-3 py-1.5 text-xs font-bold disabled:opacity-40 ${replyMode === 'email' ? 'border-sky-300 bg-sky-50 text-sky-800' : 'border-slate-200 text-slate-600'}`}>Professional Email{capabilities?.canSendEmail && !professionalEmailConnected ? ' · Connect' : ''}</button>",
              "{canUseProfessionalEmail && <button type=\"button\" disabled={!canEmail} onClick={() => setReplyMode('email')} className={`rounded-lg border px-3 py-1.5 text-xs font-bold disabled:opacity-40 ${replyMode === 'email' ? 'border-sky-300 bg-sky-50 text-sky-800' : 'border-slate-200 text-slate-600'}`}>Professional Email{capabilities?.canSendEmail && !professionalEmailConnected ? ' · Connect' : ''}</button>}")
          replace_once(sales,
              "{replyMode === 'whatsapp' && <div className=\"text-[10px] text-slate-400\">WhatsApp is text-only in the current provider connection. Use Website Chat or Professional Email for files.</div>}",
              "{replyMode === 'whatsapp' && <div className=\"text-[10px] text-slate-400\">{canUseProfessionalEmail ? 'WhatsApp is text-only in the current provider connection. Use Website Chat or Professional Email for files.' : 'WhatsApp is text-only in the current provider connection. Use Website Chat for files.'}</div>}")

          provisioning = 'supabase/functions/process-professional-mailbox-provisioning/index.ts'
          replace_once(provisioning,
              '  const {data:profile,error:profileError}=await service.from("user_profiles").select("id,full_name,email,timezone,status,onboarding_status,role").eq("id",job.user_id).maybeSingle();if(profileError||!profile){await service.rpc("service_finish_professional_mailbox_job",{p_job_id:job.id,p_status:"skipped",p_error:"Employee profile no longer exists."});continue;}\n  const {data:cfgRow}=await service.from("system_configuration")',
              '  const {data:profile,error:profileError}=await service.from("user_profiles").select("id,full_name,email,timezone,status,onboarding_status,role").eq("id",job.user_id).maybeSingle();if(profileError||!profile){await service.rpc("service_finish_professional_mailbox_job",{p_job_id:job.id,p_status:"skipped",p_error:"Employee profile no longer exists."});continue;}\n  const {data:eligible,error:eligibilityError}=await service.rpc("service_professional_mailbox_eligible",{p_user_id:job.user_id});if(eligibilityError||eligible!==true){await service.rpc("service_finish_professional_mailbox_job",{p_job_id:job.id,p_status:"skipped",p_error:"Staff role/status is no longer eligible for Professional Email."});results.push({id:job.id,status:"ineligible_skipped"});continue;}\n  const {data:cfgRow}=await service.from("system_configuration")')

          zoho = Path('supabase/functions/zoho-mail-admin/index.ts')
          zoho_text = zoho.read_text()
          old = 'Professional email is available only to eligible active Sales and Management accounts.'
          if old not in zoho_text:
              raise SystemExit('zoho-mail-admin: eligibility wording not found')
          zoho.write_text(zoho_text.replace(old, 'Professional Email is available only to eligible active Management/Admin accounts.'))

          deploy = '.github/workflows/deploy-professional-mailbox-worker.yml'
          replace_once(deploy,
              '      - name: Deploy professional mailbox provisioning worker\n        run: npx supabase functions deploy process-professional-mailbox-provisioning --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"\n',
              '      - name: Deploy professional mailbox workers\n        run: |\n          npx supabase functions deploy process-professional-mailbox-provisioning --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"\n          npx supabase functions deploy process-professional-mailbox-lifecycle --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"\n')

          test_path = Path('tests/talent-partner/chatFirstSellerCommunicationPolicy.test.ts')
          test_path.write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const migration = readFileSync('supabase/migrations/20260903063353_chat_first_seller_communication_policy.sql', 'utf8');
          const inbox = readFileSync('src/components/admin/SalesChatInbox.tsx', 'utf8');
          const provisioning = readFileSync('supabase/functions/process-professional-mailbox-provisioning/index.ts', 'utf8');
          const lifecycle = readFileSync('supabase/functions/process-professional-mailbox-lifecycle/index.ts', 'utf8');
          const deploy = readFileSync('.github/workflows/deploy-professional-mailbox-worker.yml', 'utf8');

          test('seller professional email is blocked at the authority layer while management remains eligible', () => {
            assert.match(migration, /array\['admin','project_manager','site_manager'\]::text\[\]/);
            assert.match(migration, /trg_enforce_professional_mailbox_role_policy/);
            assert.match(migration, /Seller professional email removed\. Customer communication uses secure ProFox Chat\./);
            assert.match(migration, /zoho_user_mail_send_connections/);
            assert.match(migration, /canViewEmail',v_can_view_email,'canSendEmail',v_can_send_email/);
          });

          test('transactional communication points customers back to the persistent secure chat', () => {
            assert.match(migration, /service_customer_relationship_chat_url/);
            assert.match(migration, /build_sales_meeting_customer_payload/);
            assert.match(migration, /quotation_conversation_resume_url/);
            assert.match(migration, /'conversationUrl'/);
            assert.match(migration, /continue in your secure ProFox conversation/);
          });

          test('seller UI has no professional email channel while historical email remains renderable', () => {
            assert.match(inbox, /PROFESSIONAL_EMAIL_ROLES = new Set\(\['admin','project_manager','site_manager'\]\)/);
            assert.match(inbox, /canUseProfessionalEmail && <button[^>]+>Professional Email/);
            assert.match(inbox, /canUseProfessionalEmail && conversation\.hasEmail/);
            assert.match(inbox, /channel === 'email' \? <Mail/);
            assert.match(inbox, /!canUseProfessionalEmail && replyMode === 'email'/);
          });

          test('mailbox workers fail closed for sellers and use reversible Zoho lifecycle controls', () => {
            assert.match(provisioning, /service_professional_mailbox_eligible/);
            assert.match(provisioning, /ineligible_skipped/);
            assert.match(lifecycle, /mode: \"disableUser\"/);
            assert.match(lifecycle, /mode: \"enableUser\"/);
            assert.match(lifecycle, /removeMailforward: false/);
            assert.match(lifecycle, /removeGroupMembership: false/);
            assert.doesNotMatch(lifecycle, /method:\s*\"DELETE\"/);
            assert.match(deploy, /process-professional-mailbox-lifecycle/);
          });
          """.replace('\n          ', '\n').lstrip())
          PY
      - name: Commit hardened policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-chat-first-seller-mail.yml
          git add -A
          git commit -m "Complete chat-first seller communication policy"
          git push origin HEAD:main
