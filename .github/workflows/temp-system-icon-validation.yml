name: Temporary system icon validation

on:
  push:
    branches:
      - chore/ban-sparkle-icon-systemwide

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Migration integrity check
        run: npm run migrations:check

      - name: Regression and security tests
        run: npm test

      - name: Production build
        run: npm run build
