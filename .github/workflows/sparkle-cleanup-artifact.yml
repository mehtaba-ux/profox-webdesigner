name: Sparkle cleanup artifact

on:
  push:
    branches:
      - chore/ban-sparkle-icon-systemwide

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Replace prohibited icon family
        run: node scripts/replace-prohibited-sparkle-icons-v2.mjs

      - name: Verify transformed frontend
        run: |
          if grep -RniE 'Sparkle|Sparkles|WandSparkles|sparkle|sparkles|wandsparkles|✨' src --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.html' --include='*.svg' --include='*.css'; then
            echo 'Prohibited icon usage remains after transformation.'
            exit 1
          fi

      - name: Commit transformed frontend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git diff --cached --quiet && exit 0
          git commit -m 'Replace prohibited sparkle icons system-wide'
          git push origin HEAD:chore/ban-sparkle-icon-systemwide
