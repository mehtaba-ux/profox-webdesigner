name: Sync Content Writer Career Assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public/images/careers/**'
      - '.github/workflows/sync-content-writer-career-assets.yml'

permissions:
  contents: read

concurrency:
  group: profox-content-writer-career-assets
  cancel-in-progress: true

jobs:
  sync:
    name: Sync careers visuals to R2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Upload Content Writer career visuals to Cloudflare R2
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            content-writer-hero.svg \
            content-workflow.svg \
            content-writer-growth.svg \
            content-writer-earnings.svg; do
            file="public/images/careers/$asset"
            test -s "$file"
            npx wrangler r2 object put "profox-media/careers/$asset" \
              --file "$file" \
              --content-type 'image/svg+xml' \
              --cache-control 'public, max-age=31536000, immutable' \
              --remote --force
          done

      - name: Verify R2 career visuals
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/profox-career-assets"
          mkdir -p "$verify_dir"
          for asset in \
            content-writer-hero.svg \
            content-workflow.svg \
            content-writer-growth.svg \
            content-writer-earnings.svg; do
            npx wrangler r2 object get "profox-media/careers/$asset" \
              --file "$verify_dir/$asset" --remote
            test -s "$verify_dir/$asset"
            cmp "public/images/careers/$asset" "$verify_dir/$asset"
            echo "Verified R2 career asset: careers/$asset"
          done
