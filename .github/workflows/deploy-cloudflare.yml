name: Deploy ProFox Production

on:
  workflow_dispatch:
    inputs:
      public_app_url:
        description: Public application URL to verify after deploy (optional until the production URL is configured)
        required: false
        type: string
  workflow_run:
    workflows:
      - ProFox CRM CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: profox-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare production deploy
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      # Cloudflare credentials remain protected GitHub production secrets.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Supabase project URL and publishable key are client-safe values. Prefer
      # GitHub production variables when present, with the current canonical
      # project values as safe fallbacks so deploys do not depend on duplicate
      # secrets for browser configuration.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://calabtayklhltyiriiwo.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_pLllPWGRcNcofWhD-GrHcg_t34HYo9a' }}
      PUBLIC_APP_URL: ${{ inputs.public_app_url || vars.PROFOX_PUBLIC_APP_URL || 'https://www.profoxwebdesigner.com' }}

    steps:
      - name: Checkout tested main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured for the production GitHub environment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        env:
          # Vite embeds the public Supabase client key in the browser bundle.
          VITE_SUPABASE_ANON_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Prepare encrypted Worker runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY" > "$RUNNER_TEMP/profox-worker-secrets.env"

      - name: Deploy existing Cloudflare Worker
        run: npx wrangler deploy --secrets-file "$RUNNER_TEMP/profox-worker-secrets.env"

      - name: Verify public Worker health
        shell: bash
        run: |
          set -euo pipefail
          url="${PUBLIC_APP_URL%/}/api/health"
          payload="$(curl --fail --silent --show-error --location --max-time 30 "$url")"
          HEALTH_PAYLOAD="$payload" node --input-type=module <<'NODE'
          const payload = JSON.parse(process.env.HEALTH_PAYLOAD || '{}');
          if (payload.status !== 'ok') {
            throw new Error(`Unexpected health status: ${payload.status ?? 'missing'}`);
          }
          if (payload.runtime !== 'cloudflare-worker') {
            throw new Error(`Unexpected runtime: ${payload.runtime ?? 'missing'}`);
          }
          if (payload.r2StorageBound !== true) {
            throw new Error('The production R2 media bucket is not bound.');
          }
          if (payload.r2WriteAuthConfigured !== true) {
            throw new Error('The production Worker cannot authenticate profile uploads.');
          }
          console.log(`Verified Cloudflare Worker health at ${new Date().toISOString()}`);
          NODE

      - name: Record verification status
        if: ${{ always() }}
        shell: bash
        run: |
          echo "Public health target: ${PUBLIC_APP_URL%/}/api/health" >> "$GITHUB_STEP_SUMMARY"
