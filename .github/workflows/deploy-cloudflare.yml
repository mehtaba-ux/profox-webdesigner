name: Deploy ProFox Production

on:
  workflow_dispatch:
    inputs:
      public_app_url:
        description: Public application URL to verify after deploy (optional until the production URL is configured)
        required: false
        type: string
  workflow_run:
    workflows:
      - ProFox CRM CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: profox-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare production deploy
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      # Cloudflare credentials remain protected GitHub production secrets.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Supabase project URL and publishable keys are client-safe values. Keep
      # the configured candidate separate until its shape has been validated;
      # a non-empty placeholder must never override the canonical fallback.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://calabtayklhltyiriiwo.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY_CANDIDATE: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      CANONICAL_SUPABASE_PUBLISHABLE_KEY: sb_publishable_pLllPWGRcNcofWhD-GrHcg_t34HYo9a
      PUBLIC_APP_URL: ${{ inputs.public_app_url || vars.PROFOX_PUBLIC_APP_URL || 'https://www.profoxwebdesigner.com' }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: calabtayklhltyiriiwo
      MIGRATION_BASELINE_VERSION: '20260831103000'

    steps:
      - name: Checkout tested main commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate and normalize deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_SUPABASE_URL SUPABASE_DB_URL SUPABASE_ACCESS_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured for the production GitHub environment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          candidate="${SUPABASE_PUBLISHABLE_KEY_CANDIDATE:-}"
          if [[ "$candidate" =~ ^sb_publishable_[A-Za-z0-9_-]{20,}$ ]]; then
            publishable_key="$candidate"
          else
            publishable_key="$CANONICAL_SUPABASE_PUBLISHABLE_KEY"
            echo "::warning::SUPABASE_PUBLISHABLE_KEY was missing or malformed; using the canonical public key."
          fi

          if [[ ! "$publishable_key" =~ ^sb_publishable_[A-Za-z0-9_-]{20,}$ ]]; then
            echo "::error::No valid Supabase publishable key is available."
            exit 1
          fi

          {
            echo "SUPABASE_PUBLISHABLE_KEY=$publishable_key"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$publishable_key"
          } >> "$GITHUB_ENV"

      - name: TypeScript check
        run: npm run lint

      - name: Apply checksum-verified database migrations
        run: npm run migrations:apply

      - name: Verify production database and integration readiness
        run: npm run production:verify

      - name: Deploy authenticated payment administration functions
        run: |
          npx supabase functions deploy payment-gateway-admin --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy razorpayx-payouts --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy public checkout and signed payment webhooks
        run: |
          npx supabase functions deploy payment-checkout --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy payment-webhook-paypal --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy payment-webhook-razorpay --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy payout-webhook-razorpay --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy hardened staff diagnostic function
        run: npx supabase functions deploy test-staff-login --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy communication and calendar integration functions
        run: |
          npx supabase functions deploy process-notification-outbox --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy google-calendar-oauth --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy process-google-calendar-sync --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy zoho-mail-admin --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy zoho-calendar-oauth --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy process-zoho-calendar-sync --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Production build
        run: npm run build

      - name: Verify embedded Supabase configuration and public content
        run: node scripts/verify-public-content.mjs

      - name: Prepare encrypted Worker runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY" > "$RUNNER_TEMP/profox-worker-secrets.env"

      - name: Deploy existing Cloudflare Worker
        run: npx wrangler deploy --secrets-file "$RUNNER_TEMP/profox-worker-secrets.env"

      - name: Verify public Worker health
        shell: bash
        run: |
          set -euo pipefail
          url="${PUBLIC_APP_URL%/}/api/health"
          payload="$(curl --fail --silent --show-error --location --max-time 30 "$url")"
          HEALTH_PAYLOAD="$payload" node --input-type=module <<'NODE'
          const payload = JSON.parse(process.env.HEALTH_PAYLOAD || '{}');
          if (payload.status !== 'ok') {
            throw new Error(`Unexpected health status: ${payload.status ?? 'missing'}`);
          }
          if (payload.runtime !== 'cloudflare-worker') {
            throw new Error(`Unexpected runtime: ${payload.runtime ?? 'missing'}`);
          }
          if (payload.r2StorageBound !== true) {
            throw new Error('The production R2 media bucket is not bound.');
          }
          if (payload.r2WriteAuthConfigured !== true) {
            throw new Error('The production Worker cannot authenticate profile uploads.');
          }
          console.log(`Verified Cloudflare Worker health at ${new Date().toISOString()}`);
          NODE

      - name: Verify deployed frontend configuration and public content
        env:
          VERIFY_DEPLOYED_APP: 'true'
        run: node scripts/verify-public-content.mjs

      - name: Install Chromium for production smoke tests
        run: npx playwright install --with-deps chromium

      - name: Verify deployed application in a real browser
        env:
          E2E_BASE_URL: ${{ env.PUBLIC_APP_URL }}
        run: npm run test:e2e

      - name: Activate mandatory public-form privacy consent
        env:
          ALLOW_PRODUCTION_ACTIVATION: 'true'
        run: npm run production:activate-privacy

      - name: Verify final production readiness
        run: npm run production:verify

      - name: Record verification status
        if: ${{ always() }}
        shell: bash
        run: |
          echo "Public health target: ${PUBLIC_APP_URL%/}/api/health" >> "$GITHUB_STEP_SUMMARY"
