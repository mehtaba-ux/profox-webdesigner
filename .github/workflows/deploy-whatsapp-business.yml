name: Deploy ProFox WhatsApp Business

on:
  workflow_run:
    workflows:
      - ProFox CRM CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: profox-whatsapp-business-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy WhatsApp Business transport
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: calabtayklhltyiriiwo

    steps:
      - name: Checkout tested main commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate deployment credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured in the production GitHub environment."
            exit 1
          fi

      - name: Deploy WhatsApp Business transport
        run: npx supabase functions deploy whatsapp-business --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
