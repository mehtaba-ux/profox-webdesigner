name: ProFox CRM CI

on:
  push:
    branches:
      - main
      - stabilization/core-production-repair
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Migration integrity check
        run: npm run migrations:check

      - name: Talent Partner regression tests
        run: npm test

      - name: Install Chromium for launch E2E
        run: npx playwright install --with-deps chromium

      - name: Browser launch-readiness tests
        env:
          VITE_SUPABASE_URL: https://calabtayklhltyiriiwo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_pLllPWGRcNcofWhD-GrHcg_t34HYo9a
        run: npm run test:e2e

      - name: Public content verifier syntax
        run: node --check scripts/verify-public-content.mjs

      - name: Production readiness verifier syntax
        run: node --check scripts/verify-production-readiness.mjs

      - name: Production dependency audit
        env:
          NPM_CONFIG_FETCH_RETRIES: '1'
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '1000'
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '5000'
          NPM_CONFIG_FETCH_TIMEOUT: '30000'
        shell: bash
        run: |
          set -uo pipefail
          transient_pattern='network timeout|Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ENETUNREACH|ECONNREFUSED'

          for attempt in 1 2 3; do
            echo "Running production dependency audit (attempt ${attempt}/3)..."
            if audit_output="$(npm audit --omit=dev 2>&1)"; then
              audit_status=0
            else
              audit_status=$?
            fi
            printf '%s\n' "$audit_output"

            if [ "$audit_status" -eq 0 ]; then
              exit 0
            fi

            if ! printf '%s\n' "$audit_output" | grep -Eqi "$transient_pattern"; then
              echo "::error::Production dependency audit reported a real vulnerability or an unexpected non-network failure."
              exit "$audit_status"
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Dependency audit service is temporarily unavailable; retrying after a short delay."
              sleep $((attempt * 5))
            fi
          done

          echo "::warning::npm audit could not reach its security service after 3 attempts. Continuing only because every failure matched a verified transient network/service-outage pattern; all local security tests and the locked dependency checks have already passed."
          exit 0

      - name: Production build
        run: npm run build
