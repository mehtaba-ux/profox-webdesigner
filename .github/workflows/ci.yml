name: ProFox CRM CI

on:
  push:
    branches:
      - main
      - stabilization/core-production-repair
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Migration integrity check
        run: npm run migrations:check

      - name: Talent Partner regression tests
        run: npm test

      - name: Install Chromium for launch E2E
        run: npx playwright install --with-deps chromium

      - name: Browser launch-readiness tests
        env:
          VITE_SUPABASE_URL: https://calabtayklhltyiriiwo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_pLllPWGRcNcofWhD-GrHcg_t34HYo9a
        run: npm run test:e2e

      - name: Public content verifier syntax
        run: node --check scripts/verify-public-content.mjs

      - name: Production readiness verifier syntax
        run: node --check scripts/verify-production-readiness.mjs

      - name: Production dependency audit
        env:
          NPM_CONFIG_FETCH_RETRIES: '1'
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '1000'
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '5000'
          NPM_CONFIG_FETCH_TIMEOUT: '30000'
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "Running production dependency audit (attempt ${attempt}/3)..."
            if npm audit --omit=dev; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Dependency audit did not complete successfully; retrying after a short delay."
              sleep $((attempt * 5))
            fi
          done
          echo "::error::Production dependency audit failed after 3 attempts."
          exit 1

      - name: Production build
        run: npm run build
